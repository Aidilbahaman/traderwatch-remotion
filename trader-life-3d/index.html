hairCap.position.y=0.115; hairCap.scale.set(1,1.1,1); head.add(hairCap);
// eyes: two small dark spheres, gives a readable face at this scale
for(const ex of [-0.068,0.068]){

// arms: upperArm pivot at shoulder, forearm pivot at elbow
function makeArm(side){
  const upper=new THREE.Group();
  upper.position.set(side*0.27,0.54,0); torso.add(upper);
  const uMesh=new THREE.Mesh(new THREE.CapsuleGeometry(0.075,0.3,6,10),M.shirt);

  const hand=new THREE.Mesh(new THREE.SphereGeometry(0.075,12,10),M.skin);
  hand.position.y=-0.36; fore.add(hand);
  return {upper,fore,hand};
}
const armL=makeArm(-1), armR=makeArm(1);

  const tMesh=new THREE.Mesh(new THREE.CapsuleGeometry(0.095,0.34,6,10),M.pants);

  const sMesh=new THREE.Mesh(new THREE.CapsuleGeometry(0.08,0.34,6,10),M.pants);
  sMesh.position.y=-0.21; shin.add(sMesh);
  const foot=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.08,0.24),M.hair);
  foot.position.set(0,-0.42,0.05); shin.add(foot);
  return {thigh,shin};
}
const legL=makeLeg(-1), legR=makeLeg(1);

// phone prop parented to right hand
const phone=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.24,0.018),
  new THREE.MeshStandardMaterial({color:0x0a0f1a,emissive:0x2a6df0,emissiveIntensity:0.8,roughness:0.3}));
phone.position.set(0,-0.42,0.04); phone.rotation.x=-0.3; armR.fore.add(phone);

/* ---------- poses ---------- */
// Each pose: part -> [rx,ry,rz] in radians (absolute, not additive).
const NEUTRAL={

  'armL.upper':[0.15,0,0.32], 'armL.fore':[-0.55,0,0],

const POSES={
  // 0 hook: sat still, hands on desk, staring at a dead screen
  hook:{

    'armL.upper':[0.5,0,0.24],'armL.fore':[-1.15,0,0],
    'armR.upper':[0.5,0,-0.24],'armR.fore':[-1.15,0,0],
    'legL.thigh':[-1.42,0,0.06],'legL.shin':[1.45,0,0],
    'legR.thigh':[-1.42,0,-0.06],'legR.shin':[1.45,0,0],

  },
  // 1 confident: leans back, arms folded

    'legL.thigh':[-1.36,0,0.1],'legL.shin':[1.4,0,0],

const PARTS={

  'armL.upper':armL.upper,'armL.fore':armL.fore,

  'legL.thigh':legL.thigh,'legL.shin':legL.shin,

};
function applyPose(p){
  for(const k in PARTS){
    const v=p[k]||[0,0,0];
    PARTS[k].rotation.set(v[0],v[1],v[2]);
  }
  chair.position.y=p.chair||0;
}
function lerpPose(a,b,t){
  const out={};
  for(const k in PARTS){
    const A=a[k]||[0,0,0], B=b[k]||[0,0,0];
    out[k]=[A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t];
  }
  out.chair=(a.chair||0)+((b.chair||0)-(a.chair||0))*t;
  return out;
}
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);

/* ---------- screen content ---------- */
// Synthetic OHLC, illustrative only. Explicit bodies + wicks so the
// decline reads as real movement rather than a line of dots.
const CANDLES=(function(){
  // Deterministic LCG so every capture run produces identical frames.
  let s=1337;
  const rnd=()=>{s=(s*1664525+1013904223)>>>0; return s/4294967296;};
  const out=[];
  let o=0.80;
  // act 1 grind up, act 2 first reds, act 3 false bounce, act 4 break, act 5 capitulation
  const drift=[.012,.018,.010,.014,.008,-.006,-.022,-.014,-.030,-.020,-.038,.016,.010,-.026,-.044,-.030,-.052,-.040,-.062,-.048,-.070,-.058];
  for(let i=0;i<drift.length;i++){
    const c=Math.max(0.06,Math.min(0.94,o+drift[i]));
    const body=Math.abs(c-o);
    const up=c>=o;
    const wickUp=body*0.55+0.012+rnd()*0.018;
    const wickDn=body*0.55+0.012+rnd()*0.018;
    out.push({
      o, c, up,
      h: Math.min(0.98, Math.max(o,c)+wickUp),
      l: Math.max(0.02, Math.min(o,c)-wickDn),
    });
    o=c;
  }
  return out;
})();
// Reveal is tied to the five acts so the story and the chart move together.
const REVEAL=[[0,7],[5,7],[15,11],[25,15],[35,19],[45,22]];

function drawScreen(t){
  const w=screenCanvas.width, h=screenCanvas.height;
  sx.fillStyle='#060c18'; sx.fillRect(0,0,w,h);

  const PAD_L=18, PAD_R=96, PAD_T=54, PAD_B=30;
  const plotW=w-PAD_L-PAD_R, plotH=h-PAD_T-PAD_B;
  const yOf=v=>PAD_T+plotH*(1-v);

  // grid
  sx.strokeStyle='rgba(90,130,200,.14)'; sx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=PAD_T+plotH*i/4;sx.beginPath();sx.moveTo(PAD_L,y);sx.lineTo(w-PAD_R,y);sx.stroke();}

  // header
  sx.fillStyle='rgba(150,180,225,.8)'; sx.font='600 18px monospace';
  sx.fillText('ILLUSTRATIVE', PAD_L, 30);

  // how many candles exist at time t
  let n=7;
  for(const [at,cnt] of REVEAL){ if(t>=at) n=cnt; }

  // Show only the most recent VIEW candles so each one is big enough to read.
  // The window slides as candles are revealed, like a live chart.
  const N=22, VIEW=9;
  const first=Math.max(0, n-VIEW);
  const slotW=plotW/VIEW, cw=slotW*0.64;

  // entry level = first candle open
  const entry=CANDLES[0].o;
  sx.strokeStyle='rgba(150,185,235,.55)'; sx.setLineDash([8,6]); sx.lineWidth=1.6;
  sx.beginPath(); sx.moveTo(PAD_L,yOf(entry)); sx.lineTo(w-PAD_R,yOf(entry)); sx.stroke();
  sx.setLineDash([]);

  for(let i=first;i<n;i++){
    const d=CANDLES[i];
    const cx=PAD_L+slotW*(i-first)+slotW/2;
    const col=d.up?'#3dffa0':'#ff5560';

    // wick: high to low, full range visible
    sx.strokeStyle=col; sx.lineWidth=2.4;
    sx.beginPath();
    sx.moveTo(cx, yOf(d.h));
    sx.lineTo(cx, yOf(d.l));
    sx.stroke();

    // body: open to close, minimum 5px so dojis still read
    const yO=yOf(d.o), yC=yOf(d.c);
    const top=Math.min(yO,yC), bh=Math.max(5,Math.abs(yO-yC));
    sx.fillStyle=col;
    sx.fillRect(cx-cw/2, top, cw, bh);
    // hollow body for up candles reads cleaner at this size
    if(d.up){
      sx.fillStyle='#0a1424';
      sx.fillRect(cx-cw/2+2.5, top+2.5, Math.max(1,cw-5), Math.max(1,bh-5));
      sx.strokeStyle=col; sx.lineWidth=1.8;
      sx.strokeRect(cx-cw/2+1.2, top+1.2, cw-2.4, Math.max(2,bh-2.4));
    }
  }

  // live price marker on the last revealed close
  const last=CANDLES[n-1];
  const yl=yOf(last.c);
  const col=last.up?'#3dffa0':'#ff5560';
  sx.fillStyle=col;
  sx.fillRect(w-PAD_R+4, yl-12, 80, 24);
  sx.fillStyle='#04080f'; sx.font='700 18px monospace';
  sx.fillText(((last.c-0.5)*1800+1140).toFixed(2), w-PAD_R+10, yl+6);

  // connection line from last candle to the marker
  sx.strokeStyle=col; sx.lineWidth=1; sx.setLineDash([3,3]);
  sx.beginPath();
  sx.moveTo(PAD_L+slotW*(n-1-first)+slotW/2, yl);
  sx.lineTo(w-PAD_R+4, yl); sx.stroke();
  sx.setLineDash([]);

  screenTex.needsUpdate=true;
}

/* ---------- camera keyframes ---------- */
// [t, camX, camY, camZ, targetX, targetY, targetZ]
// Act 1 stays wide on the trader. Acts 2-4 push into the screen so the
// candles are readable, then pull back for the collapse and the end card.
const CAMK=[
  [ 0.0, 2.55, 2.45, 4.70, 0.05, 1.55, 0.00],
  [ 5.0, 2.20, 2.35, 4.20, 0.15, 1.60, 0.00],
  [14.0, 1.60, 2.22, 3.30, 0.30, 1.66,-0.05],
  [20.0, 1.55, 2.05, 1.60, 0.62, 1.86,-0.50],
  [26.0, 1.90, 1.98, 0.85, 0.62, 1.86,-0.55],
  [36.0, 1.95, 1.96, 0.78, 0.62, 1.86,-0.58],
  [44.0, 1.75, 2.02, 1.20, 0.62, 1.86,-0.50],
  [49.0, 1.30, 2.20, 2.70, 0.40, 1.72,-0.18],
  [55.0, 1.10, 2.15, 3.30, 0.35, 1.68,-0.12],
  [62.0, 0.60, 2.55, 4.00, 0.25, 1.55,-0.08],
  [68.0, 0.40, 2.75, 4.40, 0.18, 1.50,-0.05],
];
const tmpA=new THREE.Vector3(), tmpB=new THREE.Vector3();
function camAt(t){
  let i=0;
  while(i<CAMK.length-2 && t>CAMK[i+1][0]) i++;
  const a=CAMK[i], b=CAMK[i+1];
  const raw=(t-a[0])/Math.max(0.001,b[0]-a[0]);
  const k=ease(Math.max(0,Math.min(1,raw)));
  cam.position.set(a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k, a[3]+(b[3]-a[3])*k);
  tmpA.set(a[4]+(b[4]-a[4])*k, a[5]+(b[5]-a[5])*k, a[6]+(b[6]-a[6])*k);
  cam.lookAt(tmpA);
}

/* ---------- timeline ---------- */
// [start, end, poseKey, caption html, number label]
const ACTS=[
  [ 5.0, 15.0,'confident', '1. The entry felt <b>obvious.</b>','ACT 1 / 5'],
  [15.0, 25.0,'leanIn',    '2. First candle closes <span class="red">red.</span>','ACT 2 / 5'],
  [25.0, 35.0,'denial',    '3. <b>“It comes back.”</b> No plan. Just hope.','ACT 3 / 5'],
  [35.0, 45.0,'moveStop',  '4. So you move the <span class="red">stop.</span>','ACT 4 / 5'],
  [45.0, 55.0,'collapsed', '5. You close at the <span class="red">worst</span> price.','ACT 5 / 5'],
];

/* ---------- DOM refs ---------- */
const $=id=>document.getElementById(id);
const elTitle=$('title'), elCap=$('cap'), elNum=$('num'), elEnd=$('end'),
      elHandle=$('handle'), elDisc=$('disc'), elBrand=$('brand');

const clamp01=v=>v<0?0:v>1?1:v;
const fade=(t,a,b)=>clamp01((t-a)/Math.max(0.001,b-a));

/* ---------- the single deterministic entry point ---------- */
window.DURATION=DUR;
window.seek=function(t){
  t=Math.max(0,Math.min(DUR,t));

  // pose: hold previous act's pose, ease into the next over 0.9s
  let pose=POSES.hook;
  for(const [s,e,key] of ACTS){
    if(t>=s){
      const prevKey=ACTS[Math.max(0,ACTS.findIndex(a=>a[2]===key)-1)]?.[2]||'hook';
      const from=POSES[prevKey]||POSES.hook;
      pose=lerpPose(from,POSES[key],ease(clamp01((t-s)/0.9)));
    }
  }
  applyPose(pose);

  // breathing / micro-motion, deterministic on t
  const breath=Math.sin(t*1.9)*0.012;
  torso.rotation.x+=breath;
  head.rotation.y+=Math.sin(t*0.55)*0.05;
  head.rotation.z+=Math.sin(t*0.83)*0.012;

  // screen
  drawScreen(t);
  monLight.intensity=13+Math.sin(t*2.4)*1.6;

  // camera
  camAt(t);

  // ---- text layer ----
  elTitle.style.opacity=fade(t,0.5,1.6)*(1-fade(t,4.2,5.0));
  elTitle.style.transform=`translateY(${(1-fade(t,0.5,1.6))*26}px)`;
  elBrand.style.opacity=fade(t,0.2,1.0)*(1-fade(t,4.6,5.2)*0.35);

  // caption + act number
  let cap='', num='', capA=0, numA=0;
  for(const [s,e,,c,n] of ACTS){
    if(t>=s-0.15 && t<=e+0.15){
      cap=c; num=n;
      capA=fade(t,s-0.15,s+0.55)*(1-fade(t,e-0.35,e+0.15));
      numA=capA;
    }
  }
  elCap.innerHTML=cap; elCap.style.opacity=capA;
  elNum.textContent=num; elNum.style.opacity=numA*0.95;

  // end card
  const endA=fade(t,56.0,57.2);
  elEnd.style.opacity=endA;
  elEnd.style.transform=`translateY(${(1-endA)*22}px)`;
  elHandle.style.opacity=fade(t,58.5,59.8);
  elDisc.style.opacity=fade(t,59.0,60.4);

  // vignette deepens as he collapses
  renderer.render(scene,cam);
};

window.seek(0);
window.__screenCanvas=screenCanvas;
window.__ready=true;
</script>
