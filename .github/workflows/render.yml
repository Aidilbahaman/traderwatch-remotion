name: Render

# Triggers
#   1. Manual: Actions -> Render -> Run workflow
#   2. Push: commit message containing [render] <CompId>[,<CompId>]
#      Example: feat: new cut [render] TechVsFundApple,TechVsFundEditorial
#
# Up to two compositions render concurrently on the self-hosted Mac runner.
on:
  workflow_dispatch:
    inputs:
      compositions:
        description: 'Composition IDs, comma separated (max 2 recommended)'
        required: true
        default: 'TechVsFundApple,TechVsFundEditorial'
      crf:
        description: 'CRF - 16 sharp, 18 smaller'
        required: false
        default: '16'
      muted:
        description: 'Strip the audio track'
        type: boolean
        default: true
  push:
    branches: [main]

concurrency:
  group: traderwatch-render
  cancel-in-progress: false

jobs:
  render:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[render]')
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          # npm ci intermittently fails on macOS with "Exit handler never called".
          # npm install is tolerant of an out-of-sync lockfile and recovers.
          npm install --no-audit --no-fund
          test -d node_modules/remotion || npm install --no-audit --no-fund

      - name: Resolve compositions
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="${{ inputs.compositions }}"
            crf="${{ inputs.crf }}"
            muted="${{ inputs.muted }}"
          else
            list="$(printf '%s' "${{ github.event.head_commit.message }}" \
                    | sed -n 's/.*\[render\][[:space:]]*//p' \
                    | head -1 | tr -d '\r')"
            crf="16"
            muted="true"
          fi
          echo "list=$list"   >> "$GITHUB_OUTPUT"
          echo "crf=$crf"     >> "$GITHUB_OUTPUT"
          echo "muted=$muted" >> "$GITHUB_OUTPUT"
          echo "Rendering: $list (crf=$crf muted=$muted)"

      - name: Render concurrently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          IFS=',' read -ra IDS <<< "${{ steps.plan.outputs.list }}"
          pids=()
          names=()

          for raw in "${IDS[@]:0:2}"; do
            id="$(printf '%s' "$raw" | xargs)"
            [ -z "$id" ] && continue

            flags=(--codec=h264 --crf="${{ steps.plan.outputs.crf }}" --jpeg-quality=95)
            if [ "${{ steps.plan.outputs.muted }}" = "true" ]; then
              flags+=(--muted)
            fi

            npx remotion render "$id" "out/${id}.mp4" "${flags[@]}" \
              > "out/${id}.log" 2>&1 &
            pids+=("$!")
            names+=("$id")
            echo "STARTED $id (pid=$!)"
          done

          failed=0
          for i in "${!pids[@]}"; do
            if wait "${pids[$i]}"; then
              echo "OK   ${names[$i]}"
            else
              echo "FAIL ${names[$i]}"
              failed=1
            fi
          done

          for log in out/*.log; do
            [ -e "$log" ] || continue
            echo "===== $log ====="
            tail -60 "$log"
          done

          exit "$failed"

      - name: Probe output
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          for f in out/*.mp4; do
            [ -e "$f" ] || continue
            echo "===== $f"
            ls -lh "$f"
            if command -v ffprobe >/dev/null 2>&1; then
              ffprobe -v error \
                -show_entries format=duration,size \
                -show_entries stream=codec_name,width,height,r_frame_rate \
                -of default=noprint_wrappers=1 "$f"
            else
              echo "(ffprobe not installed on runner - size only)"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*.log
          retention-days: 14
          if-no-files-found: warn
