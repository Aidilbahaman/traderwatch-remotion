name: Render

# Triggers
#   1. Manual: Actions -> Render -> Run workflow
#   2. Push: commit message containing [render] <CompId>[,<CompId>]
#      Example: feat: new cut [render] TechVsFundApple,TechVsFundEditorial
#
# Renders ONE composition at a time (max-parallel: 1). The Mac runner is
# slower than the VPS but stays out of the way, and each finished video
# becomes its own artifact that can be downloaded immediately.
on:
  workflow_dispatch:
    inputs:
      compositions:
        description: 'Composition IDs, comma separated'
        required: true
        default: 'TechVsFundApple,TechVsFundEditorial'
      crf:
        description: 'CRF - 16 sharp, 18 smaller'
        required: false
        default: '16'
      muted:
        description: 'Strip the audio track'
        type: boolean
        default: true
  push:
    branches: [main]

concurrency:
  group: traderwatch-render
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      crf: ${{ steps.plan.outputs.crf }}
      muted: ${{ steps.plan.outputs.muted }}

    steps:
      - name: Resolve compositions
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="${{ inputs.compositions }}"
            crf="${{ inputs.crf }}"
            muted="${{ inputs.muted }}"
          else
            list="$(printf '%s' "${{ github.event.head_commit.message }}" \
                    | sed -n 's/.*\[render\][[:space:]]*//p' \
                    | head -1 | tr -d '\r')"
            crf="16"
            muted="true"
          fi

          ids=()
          IFS=',' read -ra RAW <<< "$list"
          for raw in "${RAW[@]}"; do
            id="$(printf '%s' "$raw" | xargs)"
            [ -z "$id" ] && continue
            ids+=("$id")
          done

          if [ "${#ids[@]}" -eq 0 ]; then
            ids=("TechVsFundEditorial")
          fi

          matrix='{"include":['
          for i in "${!ids[@]}"; do
            [ "$i" -gt 0 ] && matrix+=','
            matrix+="{\"id\":\"${ids[$i]}\"}"
          done
          matrix+=']}'

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "crf=$crf"       >> "$GITHUB_OUTPUT"
          echo "muted=$muted"   >> "$GITHUB_OUTPUT"
          echo "Queue: ${ids[*]} (one at a time)"

  render:
    needs: prepare
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90

    strategy:
      # ONE AT A TIME. The Mac renders each composition in sequence so the
      # first video is downloadable long before the last one finishes.
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix).include }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          # npm ci intermittently fails on macOS with "Exit handler never called".
          # npm install is tolerant of an out-of-sync lockfile and recovers.
          npm install --no-audit --no-fund
          test -d node_modules/remotion || npm install --no-audit --no-fund

      - name: Render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          id="${{ matrix.id }}"

          flags=(--codec=h264 --crf="${{ needs.prepare.outputs.crf }}" --jpeg-quality=95)
          if [ "${{ needs.prepare.outputs.muted }}" = "true" ]; then
            flags+=(--muted)
          fi

          echo "===== RENDER $id ====="
          npx remotion render "$id" "out/${id}.mp4" "${flags[@]}" \
            > "out/${id}.log" 2>&1

          echo "===== $id LOG (tail) ====="
          tail -25 "out/${id}.log"

      - name: Probe output
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          for f in out/*.mp4; do
            [ -e "$f" ] || continue
            echo "===== $f"
            ls -lh "$f"
            if command -v ffprobe >/dev/null 2>&1; then
              ffprobe -v error \
                -show_entries format=duration,size \
                -show_entries stream=codec_name,width,height,r_frame_rate \
                -of default=noprint_wrappers=1 "$f"
            else
              echo "(ffprobe not installed on runner - size only)"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.id }}-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*.log
          retention-days: 14
          if-no-files-found: warn
